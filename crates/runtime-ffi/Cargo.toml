[package]
name = "nmp-native-runtime-ffi"
version = "0.1.0"
# `tests/receipt_steps.rs` is a submodule of the `bdd` target, not its own
# integration test. Auto-discovery would also compile it as a standalone crate
# root, where its `super::`/`crate::support` imports cannot resolve. Every
# top-level file in `tests/` must therefore be listed below or it stops running.
autotests = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "nmp_native_runtime_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
base64.workspace = true
nmp.workspace = true
nmp-native-artifact = { path = "../artifact" }
nmp-native-catalog-resolver = { path = "../catalog-resolver" }
nmp-native-nap-bridge = { path = "../nap-bridge" }
nmp-native-nmp-adapter = { path = "../nmp-adapter" }
nmp-native-provider-identity = { path = "../provider-identity" }
nmp-native-provider-inc = { path = "../provider-inc" }
nmp-native-provider-link = { path = "../provider-link" }
nmp-native-providers = { path = "../providers" }
nmp-native-runtime-app = { path = "../runtime-app" }
nmp-native-runtime-core = { path = "../runtime-core" }
nmp-native-runtime-store = { path = "../runtime-store" }
nmp-native-surface = { path = "../surface" }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uniffi.workspace = true

[dev-dependencies]
cucumber.workspace = true
nmp-native-test-harness = { path = "../test-harness" }
nostr = "0.44.4"
tempfile.workspace = true

[[test]]
name = "bdd"
harness = false

[[test]]
name = "bounds_honesty"

[[test]]
name = "permission_review"

[lints]
workspace = true
