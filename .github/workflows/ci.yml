name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_HTTP_TIMEOUT: "30"
  CARGO_NET_RETRY: "2"
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  conformance:
    name: Offline compatibility baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run offline conformance tests
        run: python3 -m unittest discover -s conformance/tests -p 'test_*.py'

      - name: Validate committed incomplete legacy evidence
        run: >-
          python3 scripts/ci/validate_legacy_reports.py
          --legacy conformance/reports/legacy-host.json
          --kehto conformance/reports/kehto-corpus.json
          --expect-incomplete

      - name: Verify the pinned baseline offline
        run: python3 conformance/scripts/verify_baseline.py

  antislop:
    name: AntiSlop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install the pinned AntiSlop release
        run: >-
          cargo install antislop
          --version 0.3.0
          --locked
          --root "$RUNNER_TEMP/antislop"

      - name: Test the bounded AntiSlop runner
        run: python3 -m unittest scripts/ci/test_run_antislop.py
        env:
          ANTISLOP_BINARY: ${{ runner.temp }}/antislop/bin/antislop

      - name: Reject unfinished first-party source
        run: >-
          python3 scripts/ci/run_antislop.py
          --binary "$RUNNER_TEMP/antislop/bin/antislop"

  legacy-evidence:
    name: Regenerate incomplete legacy evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select the legacy harness Node runtime
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22.14.0
          cache: ""

      - name: Install the exact bounded browser and package-manager harness
        run: |
          npm install --global corepack@0.31.0 playwright@1.51.1
          corepack enable
          playwright install --with-deps chromium

      - name: Run legacy runner unit tests
        run: >-
          python3 -m unittest discover
          -s conformance/tests
          -p 'test_legacy_host.py'

      - name: Regenerate reference and published fixture evidence
        run: |
          set +e
          python3 conformance/legacy-host/run.py \
            --allow-package-download \
            --browser-channel chromium \
            --package-cache "$RUNNER_TEMP/nampplets-npm-cache" \
            --report "$RUNNER_TEMP/legacy-host.json"
          runner_status=$?
          set -e
          if [ "$runner_status" -ne 2 ]; then
            echo "expected known-incomplete legacy runner exit 2, got $runner_status" >&2
            exit 1
          fi

      - name: Regenerate exact-commit Kehto evidence
        run: |
          set +e
          python3 conformance/legacy-host/run_kehto.py \
            --network \
            --report "$RUNNER_TEMP/kehto-corpus.json"
          runner_status=$?
          set -e
          if [ "$runner_status" -ne 2 ]; then
            echo "expected known-incomplete Kehto runner exit 2, got $runner_status" >&2
            exit 1
          fi

      - name: Validate regenerated evidence remains pinned and incomplete
        run: >-
          python3 scripts/ci/validate_legacy_reports.py
          --legacy "$RUNNER_TEMP/legacy-host.json"
          --kehto "$RUNNER_TEMP/kehto-corpus.json"
          --expect-incomplete

      - name: Upload regenerated non-green evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: legacy-compatibility-evidence
          path: |
            ${{ runner.temp }}/legacy-host.json
            ${{ runner.temp }}/kehto-corpus.json
          if-no-files-found: warn
          retention-days: 14

  file-growth:
    name: File-growth ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test the file-growth ratchet check
        run: python3 -m unittest scripts/ci/test_check_file_growth.py

      - name: Resolve the base revision for this change
        id: base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            base_sha="$PR_BASE_SHA"
          elif [ -n "$PUSH_BEFORE_SHA" ] \
            && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
            && git rev-parse -q --verify "${PUSH_BEFORE_SHA}^{commit}" >/dev/null 2>&1; then
            base_sha="$PUSH_BEFORE_SHA"
          elif git rev-parse -q --verify "HEAD~1" >/dev/null 2>&1; then
            base_sha="HEAD~1"
          else
            base_sha=""
          fi
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Enforce the 600-line file-growth ratchet
        if: steps.base.outputs.sha != ''
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: >-
          python3 scripts/ci/check_file_growth.py
          --base "$BASE_SHA"
          --head "$GITHUB_SHA"

  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Activate the repository-pinned Rust toolchain
        run: |
          rustup show active-toolchain | grep '^1.89.0-'
          rustc --version | grep '^rustc 1.89.0 '
          cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Deny Clippy warnings
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test the workspace
        run: cargo test --locked --workspace

      - name: Prove the lockfile stayed immutable
        run: git diff --exit-code -- Cargo.lock

  trusted-shell:
    name: Trusted shell contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select the tested Node runtime
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22.14.0
          cache: ""

      - name: Run trusted-shell tests with a per-test deadline
        run: node --test --test-timeout=10000 "web/trusted-shell/tests/*.test.js"

  apple:
    name: Apple package and shared scheme
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify the pinned Rust and Apple toolchains
        run: |
          rustup show active-toolchain | grep '^1.89.0-'
          rustc --version | grep '^rustc 1.89.0 '
          test "$(xcodebuild -version | head -n 1)" = "Xcode $(cat .xcode-version)"
          swift --version | grep 'Apple Swift version 6.1'

      - name: Install Apple Rust standard libraries
        run: >-
          rustup target add
          aarch64-apple-darwin
          x86_64-apple-darwin
          aarch64-apple-ios
          aarch64-apple-ios-sim
          x86_64-apple-ios

      - name: Test the native package build contract
        run: scripts/tests/test-build-runtime-swift-xcframework.sh

      - name: Generate checked Swift bindings and the universal XCFramework
        run: scripts/build-runtime-swift-xcframework.sh --universal --check-bindings

      - name: Prove generated source and binary tracking policy
        run: |
          git diff --exit-code -- Packages/NMPNativeRuntime/Sources/NMPNativeRuntime/NMPNativeRuntime.swift
          git check-ignore -q Packages/NMPNativeRuntime/NMPNativeRuntime.xcframework/Info.plist
          if git ls-files --error-unmatch Packages/NMPNativeRuntime/NMPNativeRuntime.xcframework >/dev/null 2>&1; then
            echo "generated XCFramework must not be committed" >&2
            exit 1
          fi

      - name: Build the iOS reference shell for a generic simulator
        run: >-
          xcodebuild build
          -workspace apps/workbench-ios/RuntimeWorkbenchiOS.xcworkspace
          -scheme RuntimeWorkbenchiOS
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/RuntimeWorkbenchiOSDerivedData"
          CODE_SIGNING_ALLOWED=NO

      - name: Test the generated Swift binding package
        run: swift test --package-path Packages/NMPNativeRuntime --parallel

      - name: Test the Apple host package
        run: swift test --package-path platforms/apple --parallel

      - name: Test the Workbench feature package
        run: swift test --package-path apps/workbench-macos/RuntimeWorkbenchPackage --parallel

      - name: Build and test the shared RuntimeWorkbench scheme
        run: >-
          xcodebuild test
          -workspace apps/workbench-macos/RuntimeWorkbench.xcworkspace
          -scheme RuntimeWorkbench
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/RuntimeWorkbenchDerivedData"
          -resultBundlePath "$RUNNER_TEMP/RuntimeWorkbenchTests.xcresult"
          -parallel-testing-enabled NO
          -test-timeouts-enabled YES
          -default-test-execution-time-allowance 60
          -maximum-test-execution-time-allowance 120
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY=-
          DEVELOPMENT_TEAM=

      - name: Upload the bounded Xcode result bundle
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: runtime-workbench-test-results
          path: ${{ runner.temp }}/RuntimeWorkbenchTests.xcresult
          if-no-files-found: warn
          retention-days: 7
